# 销售合同测试用例参数配置
# 用于存放测试用例的公共参数，便于维护和修改

# 数量(quantity)参数配置
quantity:
  # 正常场景：使用随机数
  # 范围：0.0000000000001 ~ 999999999999.9999999999999
  # 精度：13位小数
  normal:
    min: 0.0000000000001
    max: 999999999999.9999999999999
    decimals: 13
    random: true  # 使用随机数
  
  # 边界值测试用例
  boundary:
    min_value: "0.0000000000001"
    max_value: "999999999999.9999999999999"
    zero: "0"
    one: "1"
  
  # 异常场景测试用例
  invalid:
    negative: "-1.1111111111111"
    invalid_string: "invalid"
    exceed_precision: "1.12345678901234"  # 14位小数，超出限制

# 单价(unitPrice)参数配置
unitPrice:
  # 正常场景：使用随机数
  # 范围：0.0000000000001 ~ 999999999999.9999999999999
  # 精度：13位小数
  normal:
    min: 0.0000000000001
    max: 999999999999.9999999999999
    decimals: 13
    random: true  # 使用随机数
  
  # 边界值测试用例
  boundary:
    min_value: "0.0000000000001"
    max_value: "999999999999.9999999999999"
    zero: "0"
    one: "1"
  
  # 异常场景测试用例
  invalid:
    negative: "-100.1234567890123"
    invalid_string: "invalid"
    exceed_precision: "12222222.12345678901234"  # 14位小数，超出限制

# 其他合同相关参数（可根据需要添加）
contract:
  # 默认templateCode（如果接口不返回，可以使用此值）
  default_template_code: "456189212611706880"

