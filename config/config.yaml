# 框架配置文件

# 框架基本信息
framework:
  name: "AI_TEST"
  version: "1.0.0"
  description: "AI驱动的全栈自动化测试框架"

# Playwright配置
playwright:
  browser: "chromium"  # chromium/firefox/webkit
  headless: false
  viewport:
    width: 1920
    height: 1080
  timeout: 30000  # 毫秒
  screenshot_on_failure: true
  video_on_failure: true
  trace_on_failure: true
  # 本地Chrome浏览器路径（可选，如果Chrome安装失败，可以指定本地Chrome路径）
  # 示例: chrome_executable_path: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
  # 如果为空，将自动检测本地Chrome路径
  chrome_executable_path: ""  # 留空则自动检测
  # 是否使用MCP（Model Context Protocol）代替Playwright（实验性功能）
  use_mcp: false

# API测试配置
api:
  timeout: 30  # 秒
  retry_times: 3
  retry_delay: 1  # 秒
  verify_ssl: false
  log_level: "INFO"
  # 步骤重试配置
  step_retry:
    max_retries: 5  # 默认最大重试次数
    retry_delay: 1  # 每次重试间隔（秒）

# Mobile测试配置 (Maestro)
mobile:
  app_id: ""
  device_name: ""
  platform: "Android"  # Android/iOS
  timeout: 30

# 报告配置
report:
  output_dir: "reports"
  html_report: true
  allure_report: false
  screenshot_dir: "reports/screenshots"
  video_dir: "reports/videos"
  trace_dir: "reports/traces"
  har_dir: "reports/har"

# 日志配置
logging:
  level: "INFO"  # DEBUG/INFO/WARNING/ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/test.log"
  console: true

# 并发配置
concurrency:
  max_workers: 4
  timeout_per_case: 300  # 秒

# 通知配置（可选）
notification:
  email:
    enabled: false
    smtp_server: ""
    smtp_port: 25
    sender: ""
    receivers: []
  webhook:
    enabled: false
    url: ""

# Cursor AI配置
cursor:
  enabled: true
  auto_fix_on_failure: true
  auto_generate_assertion: true

