case_name: add
case_code: Add
priority: 2
steps:
- step_name: 正常场景-BigDecimal精度测试（8位小数）
  host: $get_host(ERP_TEST,pms_host)
  path: /purchase/contract/invoiceRecord/add
  headers: $generate_token(pms_host)
  method: POST
  data:
    contractCode: 456178536858124288
    invoiceAmount: 12345.12345678
    recordBatch: 1
    remark: ''
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
    jsonpath_assert:
    - $..code == 200 or $..resCode == 200 or $..code == 202 or $..resCode == 202
- step_name: 边界值测试-最小精度（0.00000001）
  host: $get_host(ERP_TEST,pms_host)
  path: /purchase/contract/invoiceRecord/add
  headers: $generate_token(pms_host)
  method: POST
  data:
    contractCode: 456178536858124288
    invoiceAmount: 1.0e-08
    recordBatch: 1
    remark: ''
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
- step_name: 边界值测试-最大值（8位整数+8位小数）
  host: $get_host(ERP_TEST,pms_host)
  path: /purchase/contract/invoiceRecord/add
  headers: $generate_token(pms_host)
  method: POST
  data:
    contractCode: 456178536858124288
    invoiceAmount: 99999999.99999999
    recordBatch: 1
    remark: ''
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
- step_name: 四舍五入测试-超过8位小数截断
  host: $get_host(ERP_TEST,pms_host)
  path: /purchase/contract/invoiceRecord/add
  headers: $generate_token(pms_host)
  method: POST
  data:
    contractCode: 456178536858124288
    invoiceAmount: 123.123456785
    recordBatch: 1
    remark: ''
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
- step_name: 异常场景-非法值（字符串）
  host: $get_host(ERP_TEST,pms_host)
  path: /purchase/contract/invoiceRecord/add
  headers: $generate_token(pms_host)
  method: POST
  data:
    contractCode: 456178536858124288
    invoiceAmount: 非法字符串
    recordBatch: 1
    remark: ''
  response_assert:
    response_assert_data: 请求参数格式错误
    status_code_assert: 200
- step_name: 异常场景-负数测试
  host: $get_host(ERP_TEST,pms_host)
  path: /purchase/contract/invoiceRecord/add
  headers: $generate_token(pms_host)
  method: POST
  data:
    contractCode: 456178536858124288
    invoiceAmount: -100.5
    recordBatch: 1
    remark: ''
  response_assert:
    response_assert_data: 发票金额错误
    status_code_assert: 200
- step_name: 边界测试-零值（应返回错误）
  host: $get_host(ERP_TEST,pms_host)
  path: /purchase/contract/invoiceRecord/add
  headers: $generate_token(pms_host)
  method: POST
  data:
    contractCode: 456178536858124288
    invoiceAmount: 0.0
    recordBatch: 1
    remark: ''
  response_assert:
    response_assert_data: 发票金额错误
    status_code_assert: 200
