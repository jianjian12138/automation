case_code: Package
case_name: package
priority: 2
steps:
- data:
    footer: footer_value
    outPartSendOrderCode: $get_db_field(outpartsendordercode)
    packageCode: $get_db_field(packagecode)
    quantityPcs: PCS
    remark: ''
    weight: 12345.12345678
    weightPcs: PCS
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/purchase/outpart/sendorder/package
  response_assert:
    jsonpath_assert:
    - $..code == 200 or $..resCode == 200 or $..code == 202 or $..resCode == 202
    response_assert_data: 成功
    status_code_assert: 200
  step_name: 正常场景-BigDecimal精度测试（8位小数）
- data:
    footer: footer_value
    outPartSendOrderCode: $get_db_field(outpartsendordercode)
    packageCode: $get_db_field(packagecode)
    quantityPcs: PCS
    remark: ''
    weight: 1.0e-08
    weightPcs: PCS
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/purchase/outpart/sendorder/package
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
  step_name: 边界值测试-最小精度（0.00000001）
- data:
    footer: footer_value
    outPartSendOrderCode: $get_db_field(outpartsendordercode)
    packageCode: $get_db_field(packagecode)
    quantityPcs: PCS
    remark: ''
    weight: 99999999.99999999
    weightPcs: PCS
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/purchase/outpart/sendorder/package
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
  step_name: 边界值测试-最大值（8位整数+8位小数）
- data:
    footer: footer_value
    outPartSendOrderCode: $get_db_field(outpartsendordercode)
    packageCode: $get_db_field(packagecode)
    quantityPcs: PCS
    remark: ''
    weight: 123.123456785
    weightPcs: PCS
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/purchase/outpart/sendorder/package
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
  step_name: 四舍五入测试-超过8位小数截断
- data:
    footer: footer_value
    outPartSendOrderCode: $get_db_field(outpartsendordercode)
    packageCode: $get_db_field(packagecode)
    quantityPcs: PCS
    remark: ''
    weight: 非法字符串
    weightPcs: PCS
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/purchase/outpart/sendorder/package
  response_assert:
    response_assert_data: 参数错误
    status_code_assert: 200
  step_name: 异常场景-非法值（字符串）
- data:
    footer: footer_value
    outPartSendOrderCode: $get_db_field(outpartsendordercode)
    packageCode: $get_db_field(packagecode)
    quantityPcs: PCS
    remark: ''
    weight: -100.5
    weightPcs: PCS
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/purchase/outpart/sendorder/package
  response_assert:
    response_assert_data: 参数错误
    status_code_assert: 200
  step_name: 异常场景-负数测试
- data:
    footer: footer_value
    outPartSendOrderCode: $get_db_field(outpartsendordercode)
    packageCode: $get_db_field(packagecode)
    quantityPcs: PCS
    remark: ''
    weight: 0.0
    weightPcs: PCS
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/purchase/outpart/sendorder/package
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
  step_name: 正常场景-零值测试
