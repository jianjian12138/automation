case_code: Unitprice
case_name: unitPrice
priority: 2
steps:
- data:
    entityCode: $get_db_field(entitycode)
    operand: 12345.12345678
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/tempcustomer/contract/products/unitPrice
  response_assert:
    jsonpath_assert:
    - $..code == 200 or $..resCode == 200 or $..code == 202 or $..resCode == 202
    response_assert_data: 成功
    status_code_assert: 200
  step_name: 正常场景-BigDecimal精度测试（8位小数）
- data:
    entityCode: $get_db_field(entitycode)
    operand: 1.0e-08
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/tempcustomer/contract/products/unitPrice
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
  step_name: 边界值测试-最小精度（0.00000001）
- data:
    entityCode: $get_db_field(entitycode)
    operand: 99999999.99999999
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/tempcustomer/contract/products/unitPrice
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
  step_name: 边界值测试-最大值（8位整数+8位小数）
- data:
    entityCode: $get_db_field(entitycode)
    operand: 123.123456785
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/tempcustomer/contract/products/unitPrice
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
  step_name: 四舍五入测试-超过8位小数截断
- data:
    entityCode: $get_db_field(entitycode)
    operand: 非法字符串
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/tempcustomer/contract/products/unitPrice
  response_assert:
    response_assert_data: 参数错误
    status_code_assert: 200
  step_name: 异常场景-非法值（字符串）
- data:
    entityCode: $get_db_field(entitycode)
    operand: -100.5
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/tempcustomer/contract/products/unitPrice
  response_assert:
    response_assert_data: 参数错误
    status_code_assert: 200
  step_name: 异常场景-负数测试
- data:
    entityCode: $get_db_field(entitycode)
    operand: 0.0
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/tempcustomer/contract/products/unitPrice
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
  step_name: 正常场景-零值测试
