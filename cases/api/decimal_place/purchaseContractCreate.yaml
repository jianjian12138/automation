  extract:
    # 提取供方的enterprise_code，从响应中的seller.usingEnterpriseCode获取
    - extract: $set_variable(sellerEnterpriseCode,$get_response_data($.data.seller.usingEnterpriseCode))
    - extract: $set_variable(sellerEnterpriseCode,$get_response_data($.data.usingEnterpriseCode))
    - extract: $set_variable(sellerEnterpriseCode,$get_response_data($..seller.usingEnterpriseCode))
    - extract: $set_variable(sellerEnterpriseCode,$get_response_data($..usingEnterpriseCode))
  # 重试配置：直到resCode的值为200才停止，默认最大重�?0次，可在config.yaml中配�?  retry_until:
    jsonpath: $..resCode == 200

- step_name: 步骤7.5-查询供方是否有产品数据（数据库查询）
  # 根据供方的enterprise_code查询product_part_*表是否有数据
  # 如果供方有产品数据，则设置hasSellerProduct=true；否则设置为false
  # 注意：此步骤用于判断是否需要执行步�?1�?1.1�?1.2（乙方获取产品）
  # 步骤说明�?  # 1. 从步�?（修改供方）接口响应中提取seller.usingEnterpriseCode作为供方的enterprise_code
  # 2. 使用框架的智能查询功能（$get_db_field）自动处理分片查�?  # 3. 框架会自动根据enterprise_code定位分片库和表，查询product_part_*�?  # 如果查询到数据，说明供方有产品，hasSellerProduct=true；否则hasSellerProduct=false
  # 注意：此步骤使用框架的智能查询功能，在步�?的extract中执行，不需要单独的HTTP请求
  # 此步骤已合并到步�?的extract中，此处仅作为占位符
  skip_when: true
  skip_result: PASS

- step_name: 步骤8-获取单个企业信息
  host: $get_host(ERP_TEST,pms_host)
