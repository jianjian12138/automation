- step_name: 步骤11.1-乙方获取产品（方�?-步骤1�?  # 前置条件：如果供方没有产品数据，则跳过此步骤（显示PASS�?  # 或者如果步�?1成功获取了productCodeSeller，则跳过此步骤（显示PASS�?  skip_when: $get_variable(hasSellerProduct) == false or $get_variable(hasSellerProduct) == null or $get_variable(sellerEnterpriseCode) == null or $get_variable(sellerEnterpriseCode) == '' or ($get_variable(productCodeSeller) != null and $get_variable(productCodeSeller) != '')
  skip_result: PASS
  host: $get_host(ERP_TEST,pms_host)
  path: /pas/product/part/type/optional
  headers: $generate_token(pms_host)
  method: POST
  data:
    entityCode: $get_variable(contractCode)
    qryType: PURCHASE_CONTRACT
    source: 1
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
    jsonpath_assert:
    - $..code == 200 or $..resCode == 200 or $..code == 202 or $..resCode == 202
    - $..data != null
  # 重试配置：直到响应成功才停止，最大重�?�?  retry_until:
    jsonpath: $..resCode == 200
    max_retries: 5

- step_name: 步骤11.2-乙方获取产品（方�?-步骤2�?  # 前置条件：如果供方没有产品数据，则跳过此步骤（显示PASS�?  # 或者如果步�?1成功获取了productCodeSeller，则跳过此步骤（显示PASS�?  skip_when: $get_variable(hasSellerProduct) == false or $get_variable(hasSellerProduct) == null or $get_variable(sellerEnterpriseCode) == null or $get_variable(sellerEnterpriseCode) == '' or ($get_variable(productCodeSeller) != null and $get_variable(productCodeSeller) != '')
