- step_name: 步骤10-甲方获取产品（方�?�?  host: $get_host(ERP_TEST,pms_host)
  path: /purchase/contract/sellProduct/page
  headers: $generate_token(pms_host)
  method: POST
  data:
    source: 0
    current: 1
    size: 20
    contractCode: $get_variable(contractCode)
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
    jsonpath_assert:
    - $..code == 200 or $..resCode == 200 or $..code == 202 or $..resCode == 202
    - $..data.records != null or $..data != null or $..data.pageDetails != null
  extract:
    # 使用JSONPath提取productCode，优先使用精确路�?    # 优先�?.data.pageDetails[0].productCode（pageDetails数组第一个元素的productCode�?    # 如果第一个提取失败，尝试使用通配符查�?    # 注意：如果pageDetails为空数组，说明合同中还没有产品，需要等待产品被添加
    - extract: $set_variable(productCode,$get_response_data($.data.pageDetails[0].productCode))
    - extract: $set_variable(productCode,$get_response_data($.data.pageDetails[0].sellProductCode))  # 备选字段名
    # 如果第一个提取失败（productCode仍为空），尝试其他路径（不使用[0]索引，避免匹配到字符串的第一个字符）
    - extract: $set_variable(productCode,$get_response_data($..productCode))
  # 重试配置：直到productCode有值才停止，最大重�?�?  retry_until:
    variable: productCode  # 检查变量productCode是否有�?    max_retries: 5  # 最多重�?�?
- step_name: 步骤10.1-甲方获取产品（方�?-步骤1�?  # 如果步骤10成功获取了productCode，则跳过此步骤（显示PASS�?  skip_when: $get_variable(productCode) != null and $get_variable(productCode) != ''
  skip_result: PASS
  host: $get_host(ERP_TEST,pms_host)
  path: /pas/product/part/type/optional
  headers: $generate_token(pms_host)
  method: POST
  data:
    entityCode: $get_variable(contractCode)
    qryType: PURCHASE_CONTRACT
    source: 0
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
    jsonpath_assert:
    - $..code == 200 or $..resCode == 200 or $..code == 202 or $..resCode == 202
    - $..data != null
  # 重试配置：直到响应成功才停止，最大重�?�?  retry_until:
    jsonpath: $..resCode == 200
    max_retries: 5

- step_name: 步骤10.2-甲方获取产品（方�?-步骤2�?  # 如果步骤10成功获取了productCode，则跳过此步骤（显示PASS�?  skip_when: $get_variable(productCode) != null and $get_variable(productCode) != ''
  skip_result: PASS
  host: $get_host(ERP_TEST,pms_host)
  path: /pas/product/part/optional
  headers: $generate_token(pms_host)
  method: POST
  data:
    entityCode: $get_variable(contractCode)
    qryType: PURCHASE_CONTRACT
    current: 1
    size: 20
    source: 0
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
    jsonpath_assert:
    - $..code == 200 or $..resCode == 200 or $..code == 202 or $..resCode == 202
    - $..data != null or $..data.records != null
  extract:
    # 提取产品代码，支持单个或多个
    # 优先提取第一个productCode作为productCode
    - extract: $set_variable(productCode,$get_response_data($.data.records[0].productCode))
    - extract: $set_variable(productCode,$get_response_data($.data[0].productCode))
    # 不使用[0]索引，避免匹配到字符串的第一个字�?    - extract: $set_variable(productCode,$get_response_data($..productCode))
    # 提取所有productCode作为productCodes数组（用于批量添加）
    - extract: $set_variable(productCodes,$get_response_data($..productCode))
    - extract: $set_variable(productCodes,$get_response_data($.data.records[*].productCode))
  # 重试配置：直到productCode或productCodes有值才停止，最大重�?�?  retry_until:
    variable: productCode  # 检查变量productCode是否有�?    max_retries: 5  # 最多重�?�?

- step_name: 步骤11-乙方获取产品（方�?�?  # 前置条件：如果供方没有产品数据（hasSellerProduct=false），则跳过此步骤（显示PASS�?  skip_when: $get_variable(hasSellerProduct) == false or $get_variable(hasSellerProduct) == null or $get_variable(sellerEnterpriseCode) == null or $get_variable(sellerEnterpriseCode) == ''
