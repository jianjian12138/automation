
# 采购合同创建场景
# 使用的数据库表：
# 1. dm_m9.purchase_t_dm_m9_venders_9 - 供方信息表（获取 venderDataPrimaryKey�?# 2. dm_m9.purchase_t_dm_m9_vender_contacts_9 - 供方联系人表（获�?venderContactPrimaryKey�?# 注意：这是一个完整的采购合同创建流程，包�?9个步骤，严格按照文档顺序执行
# 小数点位限制�?3位（quantity �?unitPrice 字段支持13位小数）
# 产品获取区分甲方（source=0）和乙方（source=1�?
case_code: PurchaseContractCreate
case_name: purchaseContractCreate
priority: 2
steps:
- step_name: 步骤1-查询模版
  host: $get_host(ERP_TEST,pms_host)
  path: /purchase/template/contract/using
  headers: $generate_token(pms_host)
  method: POST
  data:
    current: 1
    size: 300
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
    jsonpath_assert:
    - $..code == 200 or $..resCode == 200 or $..code == 202 or $..resCode == 202
    - $..data != null or $..data.records != null
  extract:
    - extract: $set_variable(templateCode,$get_response_data($..templateCode[0]))
    - extract: $set_variable(templateCode,$get_response_data($.data[0].templateCode))
    - extract: $set_variable(templateCode,$get_response_data($.data.records[0].templateCode))

- step_name: 步骤2-创建合同
  host: $get_host(ERP_TEST,pms_host)
  path: /purchase/contract/create
  headers: $generate_token(pms_host)
  method: POST
  data:
    templateCode: $get_variable(templateCode)
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
    jsonpath_assert:
    - $..code == 200 or $..resCode == 200 or $..code == 202 or $..resCode == 202
    - $..data.contractCode != null
  extract:
    - extract: $set_variable(contractCode,$get_response_data($.data.contractCode))
    - extract: $set_variable(dataVersion,$get_response_data($.data.dataVersion))
    # 提取clauseCode，从创建合同的响应中获取
    - extract: $set_variable(clauseCode,$get_response_data($.data.clauseCode))
    - extract: $set_variable(clauseCode,$get_response_data($..clauseCode))

- step_name: 步骤3-查询供方信息
  host: $get_host(ERP_TEST,pms_host)
  path: /purchase/vender/page
  headers: $generate_token(pms_host)
  method: POST
  data:
    current: 1
    size: 300
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
    jsonpath_assert:
    - $..code == 200 or $..resCode == 200 or $..code == 202 or $..resCode == 202
    - $..data != null or $..data.records != null
  extract:
    # 优先提取：从pageDetails数组的第一个元素提取（根据实际响应结构，这是正确的路径�?    - extract: $set_variable(venderDataPrimaryKey,$get_response_data($.data.pageDetails[0].venderDataPrimaryKey))
    # 备选：从records数组的第一个元素提�?    - extract: $set_variable(venderDataPrimaryKey,$get_response_data($.data.records[0].venderDataPrimaryKey))
    # 备选：从data数组提取
    - extract: $set_variable(venderDataPrimaryKey,$get_response_data($.data[0].venderDataPrimaryKey))
    # 最后尝试：使用通配符查找（不使用[0]索引，避免匹配到字符串的第一个字符）
    - extract: $set_variable(venderDataPrimaryKey,$get_response_data($..venderDataPrimaryKey))

- step_name: 步骤4-获取企业信息
  host: $get_host(ERP_TEST,pms_host)
  path: /purchase/contract/enterprise/optional/page
  headers: $generate_token(pms_host)
  method: POST
  data:
    current: 1
    size: 300
    identity: 0
    entityCode: $get_variable(contractCode)
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
    jsonpath_assert:
    - $..code == 200 or $..resCode == 200 or $..code == 202 or $..resCode == 200
    - $..data != null or $..data.records != null

- step_name: 步骤5-获取报价类型
  host: $get_host(ERP_TEST,pms_host)
  path: /paymentStrategy/get
  headers: $generate_token(pms_host)
  method: GET
  data: {}
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
    jsonpath_assert:
    - $..code == 200 or $..resCode == 200 or $..code == 202 or $..resCode == 202
  extract:
    # 优先提取：从data数组的第一个元素提取code字段
    - extract: $set_variable(paymentStrategyCode,$get_response_data($.data[0].code))
    - extract: $set_variable(paymentStrategyCode,$get_response_data($.data[0].paymentStrategyCode))
    - extract: $set_variable(paymentStrategyCode,$get_response_data($.data[0].primaryKey))
    - extract: $set_variable(paymentStrategyCode,$get_response_data($.data.records[0].code))
    - extract: $set_variable(paymentStrategyCode,$get_response_data($.data.records[0].paymentStrategyCode))
    # 备选：使用通配符查�?    - extract: $set_variable(paymentStrategyCode,$get_response_data($..code[0]))
    - extract: $set_variable(paymentStrategyCode,$get_response_data($..paymentStrategyCode[0]))
  # 重试配置：直到响应成功才停止，默认最大重�?0�?  retry_until:
    jsonpath: $..resCode == 200

- step_name: 步骤6-查询供方联系�?  host: $get_host(ERP_TEST,pms_host)
  path: /purchase/vender/contacts
  headers: $generate_token(pms_host)
  method: POST
  data:
    venderDataPrimaryKey: $get_variable(venderDataPrimaryKey)
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
    jsonpath_assert:
    - $..code == 200 or $..resCode == 200 or $..code == 202 or $..resCode == 202
    - $..data != null
  extract:
    # 优先提取：从data数组的第一个元素提�?    - extract: $set_variable(venderContactPrimaryKey,$get_response_data($.data[0].venderContactPrimaryKey))
    - extract: $set_variable(venderContactPrimaryKey,$get_response_data($.data[0].contactKey))
    - extract: $set_variable(venderContactPrimaryKey,$get_response_data($.data[0].primaryKey))
    - extract: $set_variable(venderContactPrimaryKey,$get_response_data($.data.records[0].venderContactPrimaryKey))
    - extract: $set_variable(venderContactPrimaryKey,$get_response_data($.data.records[0].contactKey))
    - extract: $set_variable(venderContactPrimaryKey,$get_response_data($.data.records[0].primaryKey))
    # 备选：使用通配符查�?    - extract: $set_variable(venderContactPrimaryKey,$get_response_data($..venderContactPrimaryKey[0]))
    - extract: $set_variable(venderContactPrimaryKey,$get_response_data($..contactKey[0]))
    - extract: $set_variable(venderContactPrimaryKey,$get_response_data($..primaryKey[0]))
  # 重试配置：直到resCode的值为200才停止，默认最大重�?0次，可在config.yaml中配�?  retry_until:
    jsonpath: $..resCode == 200

- step_name: 步骤7-修改供方
  host: $get_host(ERP_TEST,pms_host)
  path: /purchase/contract/seller
  headers: $generate_token(pms_host)
  method: POST
  data:
    contractCode: $get_variable(contractCode)
    venderDataPrimaryKey: $get_variable(venderDataPrimaryKey)
    venderContactPrimaryKey: $get_variable(venderContactPrimaryKey)
