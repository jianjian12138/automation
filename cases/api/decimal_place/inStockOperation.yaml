case_code: Instockoperation
case_name: inStockOperation
priority: 2
steps:
- data:
    contractCode: $get_db_field(contract_code)
    contractNumber: contractnumber_value
    dataKey: $get_db_field(data_key)
    inStockList: &id001
    - batch: batch_value
      batchCode: $get_db_field(batch_code)
      inStockNum: 0.0
      positionCode: $get_db_field(position_code)
      recordCode: $get_db_field(record_code)
      stockCode: $get_db_field(stock_code)
    stockBingPositionList: &id002
    - changePositionCode: $get_db_field(position_code)
      positionStockNum: 0.0
      stockCode: $get_db_field(stock_code)
      toBeAddPositionCodes:
      - $get_db_field(position_code)
      toBeDeletePositionCodes:
      - $get_db_field(position_code)
      unChangePositionCode: $get_db_field(position_code)
    stockCode: $get_db_field(stock_code)
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/collaborate/warehouse/inbound/inStockOperation
  response_assert:
    jsonpath_assert:
    - $..code == 200 or $..resCode == 200 or $..code == 202 or $..resCode == 202
    response_assert_data: 成功
    status_code_assert: 200
  step_name: 正常场景-BigDecimal精度测试（8位小数）
- data:
    contractCode: $get_db_field(contract_code)
    contractNumber: contractnumber_value
    dataKey: $get_db_field(data_key)
    inStockList: *id001
    stockBingPositionList: *id002
    stockCode: $get_db_field(stock_code)
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/collaborate/warehouse/inbound/inStockOperation
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
  step_name: 边界值测试-最小精度（0.00000001）
- data:
    contractCode: $get_db_field(contract_code)
    contractNumber: contractnumber_value
    dataKey: $get_db_field(data_key)
    inStockList: *id001
    stockBingPositionList: *id002
    stockCode: $get_db_field(stock_code)
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/collaborate/warehouse/inbound/inStockOperation
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
  step_name: 边界值测试-最大值（8位整数+8位小数）
- data:
    contractCode: $get_db_field(contract_code)
    contractNumber: contractnumber_value
    dataKey: $get_db_field(data_key)
    inStockList: *id001
    stockBingPositionList: *id002
    stockCode: $get_db_field(stock_code)
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/collaborate/warehouse/inbound/inStockOperation
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
  step_name: 四舍五入测试-超过8位小数截断
- data:
    contractCode: $get_db_field(contract_code)
    contractNumber: contractnumber_value
    dataKey: $get_db_field(data_key)
    inStockList: *id001
    stockBingPositionList: *id002
    stockCode: $get_db_field(stock_code)
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/collaborate/warehouse/inbound/inStockOperation
  response_assert:
    response_assert_data: 参数错误
    status_code_assert: 200
  step_name: 异常场景-非法值（字符串）
- data:
    contractCode: $get_db_field(contract_code)
    contractNumber: contractnumber_value
    dataKey: $get_db_field(data_key)
    inStockList: *id001
    stockBingPositionList: *id002
    stockCode: $get_db_field(stock_code)
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/collaborate/warehouse/inbound/inStockOperation
  response_assert:
    response_assert_data: 参数错误
    status_code_assert: 200
  step_name: 异常场景-负数测试
- data:
    contractCode: $get_db_field(contract_code)
    contractNumber: contractnumber_value
    dataKey: $get_db_field(data_key)
    inStockList: *id001
    stockBingPositionList: *id002
    stockCode: $get_db_field(stock_code)
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/collaborate/warehouse/inbound/inStockOperation
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
  step_name: 正常场景-零值测试
