  data:
    customerPrimaryKey: $get_db_field(customerPrimaryKey)
    customersSign: "das"
    customersName: "JJ"
    visitContacts: "gggg"
    estimatedCost: "非法字符�?
    visitDate: "2025-11-05 14:09:53"
    visitReason: "异常场景测试-非法�?
  response_assert:
