  headers: $generate_token(pms_host)
  method: POST
  data:
    customerPrimaryKey: $get_db_field(customerPrimaryKey)
    customersSign: "das"
    customersName: "JJ"
    visitContacts: "gggg"
    estimatedCost: "0.0000000000001"
    visitDate: "2025-11-05 14:09:53"
    visitReason: "边界值测�?最小精�?
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
    jsonpath_assert:
    - $..code == 200 or $..resCode == 200 or $..code == 202 or $..resCode == 202

- step_name: 边界值测�?最大值（13位整�?13位小数）
