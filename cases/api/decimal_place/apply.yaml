  host: $get_host(ERP_TEST,pms_host)
  path: /sell/customer/apply
  headers: $generate_token(pms_host)
  method: POST
  data:
    customerPrimaryKey: $get_db_field(customerPrimaryKey)
    customersSign: "das"
    customersName: "JJ"
    visitContacts: "gggg"
    estimatedCost: "123.123456789012345"
    visitDate: "2025-11-05 14:09:53"
    visitReason: "四舍五入测试-超过13位小�?
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
    jsonpath_assert:
    - $..code == 200 or $..resCode == 200 or $..code == 202 or $..resCode == 202

