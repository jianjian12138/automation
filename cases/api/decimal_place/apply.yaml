# 客户拜访申请场景
# 使用的数据库表：
# 1. dm_m9.sell_t_dm_m9_customers_9 - 客户信息表（主要表，获取 customerPrimaryKey�?
# 2. dm_m9.sell_t_dm_m9_customer_visit_9 - 客户拜访表（拜访记录明细�?
# 注意：customerPrimaryKey 字段的值从数据库中查询，从 customers 表中随机获取一个有效的客户主键
# 小数点位限制�?3位（estimatedCost字段支持13位小数）

case_code: Apply
case_name: apply
priority: 2
steps:
- step_name: 正常场景-BigDecimal精度测试�?3位小数）
  host: $get_host(ERP_TEST,pms_host)
  path: /sell/customer/apply
  headers: $generate_token(pms_host)
  method: POST
  data:
    customerPrimaryKey: $get_db_field(customerPrimaryKey)
    customersSign: "das"
    customersName: "JJ"
    visitContacts: "gggg"
    estimatedCost: "12345.1234567890123"
    visitDate: "2025-11-05 14:09:53"
    visitReason: "lklkkkkk"
  response_assert:
    jsonpath_assert:
    - $..code == 200 or $..resCode == 200 or $..code == 202 or $..resCode == 202
    response_assert_data: 成功
    status_code_assert: 200

- step_name: 边界值测�?最小精度（0.0000000000001�?
