# 客户拜访申请更新场景
# 使用的数据库表：
# 1. dm_m9.sell_t_dm_m9_customers_9 - 客户信息表（主要表，获取 customerPrimaryKey）
# 2. dm_m9.sell_t_dm_m9_customer_visit_9 - 客户拜访表（拜访记录明细，获取 primaryKey 和 id）
# 注意：
# - customerPrimaryKey 字段的值从数据库中查询，从 customers 表中随机获取一个有效的客户主键
# - primaryKey 和 id 字段的值从 customer_visit 表中查询，用于更新已存在的拜访记录
# 小数点位限制：13位（estimatedCost字段和actualCosts字段支持13位小数）

case_code: ApplyUpdate
case_name: applyUpdate
priority: 2
steps:
# 注意：id 和 primaryKey 从 customer_visit 表查询，确保来自同一条记录
# 由于更新接口需要 id 和 primaryKey 匹配，直接从数据库查询 customer_visit 表的一条记录
# 注意：如果查询失败，可能需要先使用 apply 接口创建一条拜访记录

- step_name: 正常场景-BigDecimal精度测试（13位小数）
  host: $get_host(ERP_TEST,pms_host)
  path: /sell/customer/apply/update
  headers: $generate_token(pms_host)
  method: POST
  data:
    id: $get_db_field(id, visit=true)
    primaryKey: $get_db_field(primary_key, visit=true, same_record=true)
    customerPrimaryKey: $get_db_field(customerPrimaryKey)
    customersSign: "das"
    customersName: "JJ"
    visitContacts: "gggg"
    estimatedCost: "12345.1234567890123"
    actualCosts: "12345.1234567890123"
    visitDate: "2025-11-05 14:09:53"
    visitReason: "正常场景测试-更新"
  response_assert:
    jsonpath_assert:
    - $..code == 200 or $..resCode == 200 or $..code == 202 or $..resCode == 202
    response_assert_data: 成功
    status_code_assert: 200

- step_name: 边界值测试-最小精度（0.0000000000001）
  host: $get_host(ERP_TEST,pms_host)
  path: /sell/customer/apply/update
  headers: $generate_token(pms_host)
  method: POST
  data:
    id: $get_db_field(id, visit=true)
    primaryKey: $get_db_field(primary_key, visit=true, same_record=true)
    customerPrimaryKey: $get_db_field(customerPrimaryKey)
    customersSign: "das"
    customersName: "JJ"
    visitContacts: "gggg"
    estimatedCost: "0.0000000000001"
    actualCosts: "0.0000000000001"
    visitDate: "2025-11-05 14:09:53"
    visitReason: "边界值测试-最小精度"
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
    jsonpath_assert:
    - $..code == 200 or $..resCode == 200 or $..code == 202 or $..resCode == 202

