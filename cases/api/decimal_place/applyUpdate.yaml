    customersSign: "das"
    customersName: "JJ"
    visitContacts: "gggg"
    estimatedCost: "99999999.9999999999999"
    actualCosts: "99999999.9999999999999"
    visitDate: "2025-11-05 14:09:53"
    visitReason: "边界值测试-最大值"
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
    jsonpath_assert:
    - $..code == 200 or $..resCode == 200 or $..code == 202 or $..resCode == 202

