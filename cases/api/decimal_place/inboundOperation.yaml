      batchGlobalCode: $get_db_field(batch_global_code)
      batchNumber: BATCH_20250101_001
      count: 0.0
      isBatchPullDown: true
      positionCode: $get_db_field(position_code)
      positionStockBatchCode: $get_db_field(position_stock_batch_code)
      remark: ''
      stockType: 类型A
    operationTime: '2025-01-01 12:00:00'
    productPartCode: $get_db_field(product_part_code)
