case_code: Updatestock
case_name: updateStock
priority: 2
steps:
- step_name: 正常场景-safeInventory和stockLimit�?2位整数）
  host: $get_host(ERP_TEST,pms_host)
  path: /technology/inventory/updateStock
  headers: $generate_token(pms_host)
  method: POST
  data:
    countCycle: $get_db_field(countCycle)
    state: true
    safeInventory: "122222222222"
    stockLimit: "133333333333"
    remark: "正常场景测试"
    productPartTypeCode: $get_db_field(productPartTypeCode)
    pcs: $get_db_field(pcs)
    model: "-"
    name: $get_db_field(name)
    stockCode: $get_db_field(stockCode)
    unityNo: $get_db_field(unityNo)
  response_assert:
    response_assert_data: 编辑库存信息成功
