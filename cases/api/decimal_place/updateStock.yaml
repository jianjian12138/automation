# 1. dm_m9.technology_t_dm_m9_inventory_9 - 库存表（主要表）
# 2. dm_m9.base_module_t_dm_m9_product_part_9 - 产品部件表（产品部件信息�?
# 3. dm_m9.base_module_t_dm_m9_stock_9 - 库存代码表（库存代码信息�?
# 注意：safeInventory �?stockLimit 字段支持最�?2位整数，没有小数校验
