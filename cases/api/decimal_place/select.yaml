# 客户查询场景
# 使用的数据库表：
# 1. dm_m9.sell_t_dm_m9_customers_9 - 客户信息表（主要表，查询 primaryKey�?
# 注意：此接口为查询接口，只需要传�?primaryKey 查询客户信息
# 小数点位限制�?位（visitList[].estimatedCost �?visitList[].actualCosts 字段支持8位小数）

case_code: Select
case_name: select
priority: 2
steps:
- step_name: 正常场景-查询客户信息�?位小数精度测试）
  host: $get_host(ERP_TEST,pms_host)
  path: /sell/customer/select
  headers: $generate_token(pms_host)
  method: POST
  data:
    primaryKey: $get_db_field(customerPrimaryKey)
  response_assert:
    response_assert_data: 查询客户的详情成�?
    status_code_assert: 200
    jsonpath_assert:
    - $..resCode == 200 or $..resCode == 202 or $..code == 200 or $..code == 202
    - $..data.visitList != null

- step_name: 异常场景-缺少必填参数primaryKey
  host: $get_host(ERP_TEST,pms_host)
  path: /sell/customer/select
  headers: $generate_token(pms_host)
  method: POST
  data: {}
  response_assert:
    status_code_assert: 500

- step_name: 异常场景-无效的primaryKey
  host: $get_host(ERP_TEST,pms_host)
  path: /sell/customer/select
  headers: $generate_token(pms_host)
  method: POST
  data:
    primaryKey: "999999999999999999"
  response_assert:
    status_code_assert: 500

- step_name: 正常场景-查询已有客户的拜访记�?
  host: $get_host(ERP_TEST,pms_host)
  path: /sell/customer/select
  headers: $generate_token(pms_host)
  method: POST
  data:
    primaryKey: $get_db_field(customerPrimaryKey)
  response_assert:
    response_assert_data: 查询客户的详情成�?
    status_code_assert: 200
    jsonpath_assert:
    - $..resCode == 200 or $..resCode == 202 or $..code == 200 or $..code == 202
    - $..data.visitList != null

