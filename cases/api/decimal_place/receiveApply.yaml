case_code: Receiveapply
case_name: receiveApply
priority: 2
steps:
- data:
    mainId: 123456789
    partCode: $get_db_field(partcode)
    produceReceiveMaterialCode: $get_db_field(producereceivematerialcode)
    receiveNum: 12345.12345678
    receiveRemark: ''
    scrapNum: 12345.12345678
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/technology/produce/receiveApply
  response_assert:
    jsonpath_assert:
    - $..code == 200 or $..resCode == 200 or $..code == 202 or $..resCode == 202
    response_assert_data: 成功
    status_code_assert: 200
  step_name: 正常场景-BigDecimal精度测试（8位小数）
- data:
    mainId: 123456789
    partCode: $get_db_field(partcode)
    produceReceiveMaterialCode: $get_db_field(producereceivematerialcode)
    receiveNum: 1.0e-08
    receiveRemark: ''
    scrapNum: 1.0e-08
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/technology/produce/receiveApply
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
  step_name: 边界值测试-最小精度（0.00000001）
- data:
    mainId: 123456789
    partCode: $get_db_field(partcode)
    produceReceiveMaterialCode: $get_db_field(producereceivematerialcode)
    receiveNum: 99999999.99999999
    receiveRemark: ''
    scrapNum: 99999999.99999999
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/technology/produce/receiveApply
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
  step_name: 边界值测试-最大值（8位整数+8位小数）
- data:
    mainId: 123456789
    partCode: $get_db_field(partcode)
    produceReceiveMaterialCode: $get_db_field(producereceivematerialcode)
    receiveNum: 123.123456785
    receiveRemark: ''
    scrapNum: 123.123456785
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/technology/produce/receiveApply
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
  step_name: 四舍五入测试-超过8位小数截断
- data:
    mainId: 123456789
    partCode: $get_db_field(partcode)
    produceReceiveMaterialCode: $get_db_field(producereceivematerialcode)
    receiveNum: 非法字符串
    receiveRemark: ''
    scrapNum: 非法字符串
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/technology/produce/receiveApply
  response_assert:
    response_assert_data: 参数错误
    status_code_assert: 200
  step_name: 异常场景-非法值（字符串）
- data:
    mainId: 123456789
    partCode: $get_db_field(partcode)
    produceReceiveMaterialCode: $get_db_field(producereceivematerialcode)
    receiveNum: -100.5
    receiveRemark: ''
    scrapNum: -100.5
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/technology/produce/receiveApply
  response_assert:
    response_assert_data: 参数错误
    status_code_assert: 200
  step_name: 异常场景-负数测试
- data:
    mainId: 123456789
    partCode: $get_db_field(partcode)
    produceReceiveMaterialCode: $get_db_field(producereceivematerialcode)
    receiveNum: 0.0
    receiveRemark: ''
    scrapNum: 0.0
  headers: $generate_token(pms_host)
  host: $get_host(ERP_TEST,pms_host)
  method: POST
  path: /pms/technology/produce/receiveApply
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
  step_name: 正常场景-零值测试
