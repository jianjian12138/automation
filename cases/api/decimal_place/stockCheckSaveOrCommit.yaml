  method: POST
  path: /pms/technology/inventory/stockCheck/stockCheckSaveOrCommit
  response_assert:
    response_assert_data: 成功
    status_code_assert: 200
  step_name: 四舍五入测试-超过8位小数截断
- data:
    checkVersion: 1
    children: *id001
    positionCodes: *id002
    productPartCode: $get_db_field(product_part_code)
    saveOrCommit: true
    stockCode: $get_db_field(stock_code)
