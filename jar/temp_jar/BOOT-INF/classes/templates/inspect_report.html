<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8"/>
    <title>质检报告</title>
    <style>
        @page landscape {
            size: landscape;
        }

        @page {
            size: A4;
            margin: 6mm 4mm;
            padding: 0;

        }

        @media print {
            .page-footer {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                text-align: center;
                font-size: 10pt;
                padding: 10mm;
            }

            .right {
                font-weight: bold;
            }
        }

        body {
            counter-reset: page; /* 初始化计数器 */
        }

        .page-portrait:before {
            /*content: "�? counter(page) "�?;*/
            counter-increment: page;
        }

        /* 新一�?*/
        .new-page {
            page-break-after: always;
        }

        /*纵向尺寸*/
        .page-portrait {
            margin: 0 6mm;
        }

        .portrait-title {
            font-size: 24pt;
            font-weight: bold;
            text-align: center;
        }

        .portrait-num {
            font-size: 12pt;
            font-weight: bold;
            margin-bottom: 2mm;
        }

        /*横向尺寸*/
        .page-landscape {
            page: landscape;
        }

        /*简宋必须有，否则转pdf没用*/
        body {
            margin: 0;
            font-family: SimSun, sans-serif;
            font-size: 14px;
        }

        .title {
            text-align: center;
            font-weight: bold;
        }

        .center {
            text-align: center;
        }

        .right {
            text-align: right;
        }

        .left {
            text-align: left;
        }

        .bold {
            font-weight: bold;
        }

        .tableBottom tr td {
            border-bottom: 1px solid black;
            border-left: 1px solid black;
            border-right: 1px solid black;
            border-top: 1px solid black;
            text-align: center;
            word-break: break-all;
        }

        .tableBottom tr td > p {
            word-break: break-word;
            font-weight: bold;
        }

        .tableTop tr td > p {
            word-break: break-word;
            font-weight: bold;
        }

        .tableTop tr td {
            border-left: 1px solid black;
            border-right: 1px solid black;
            border-top: 1px solid black;
            height: 1px;
            padding: 4px;
            text-align: center;
            word-break: break-all;
        }

        /*/避免图片被截�?/
        img {
            page-break-after: always !important;
            page-break-inside: avoid !important;
        }

        .Bodyborder {
            page-break-after: always;
        }

        .QRcode {
            width: 16mm;
            height: 16mm;
            vertical-align: bottom;
        }

        .bottomCheck {
            padding: 10px;
            border-bottom: 1px solid black;
            border-left: 1px solid black;
            border-right: 1px solid black;
        }

        .bottomCheck-none {
            padding: 10px;
            /*position: relative;*/
        }

        .stamp {
            margin-top: 20px;
            width: 50mm;
            height: 50mm;
            /*display: flex;*/
            /*flex-direction: column;*/
            /*align-items: center;*/
            /*justify-content: flex-end;*/
            /*position: relative;*/
        }

        .stampTitle {
            z-index: 10;
            word-break: break-all;
            text-align: center;
        }

        .stampTime {
            z-index: 10;
            margin-top: 5px;
            margin-bottom: 20px;
            word-break: break-all;
            text-align: center;

        }

        .stampImg {
            position: absolute;
            width: 50mm;
            height: 50mm;
            z-index: 1;
        }

        .right-part {
            position: absolute;
            right: 10px;
        }

        .part-title {
            position: relative;
            right: 10px;
            width: 200px;
            display: flex;
            text-align: center;
            justify-content: center;
        }

        img {
            position: absolute;
            right: 20px;
            top: -70px;
        }

        .content {
            padding: 14px 0;
        }
    </style>
</head>

<body>

<div class="page-portrait">
    <div class="portrait-title"><p th:text="${title}">成品检质检报告</p></div>
    <div class="Bodyborder">
        <br/>
        <div class="portrait-num"><p th:text="'单号�? + ${bussNumber == null ? '' : bussNumber}"></p></div>
        <table style="border-collapse:collapse; width:100%">
            <tbody class="tableTop">
            <tr>
                <td style="width:16%">
                    <p><strong>批次�?/strong></p>
                </td>
                <td style="width:20%">
                    <div th:text="${batchNum}" style="word-wrap:break-word;padding: 0 4px;font-weight: bold;"></div>
                </td>
                <td style="width:12%">
                    <p><strong>产品</strong></p>
                </td>
                <td style="width:20%">
                    <p th:text="${name}"></p>
                </td>
                <td style="width:12%">
                    <p><strong>检验依�?/strong></p>
                </td>
                <td style="width:20%">
                    <div th:text="${inspectBasic}" style="word-wrap:break-word;padding: 0 4px;font-weight: bold;"></div>
                </td>
            </tr>
            <tr>
                <td style="width:16%">
                    <p><strong>检验日�?/strong></p>
                </td>
                <td style="width:20%">
                    <div th:text="${inspectDateRange}" style="word-wrap:break-word;padding: 0 4px;font-weight: bold;">
                        2024.01.01-2024.03.01
                    </div>
                </td>
                <td style="width:12%">
                    <p><strong>送检数量</strong></p>
                </td>
                <td style="width:20%">
                    <p th:text="${taskNum}"></p>
                </td>
                <td style="width:12%">
                    <p><strong>检验数�?/strong></p>
                </td>
                <td style="width:20%">
                    <p th:text="${inspectNum}"></p>
                </td>
            </tr>
            </tbody>
        </table>
        <table style="border-collapse:collapse; width:100%">
            <tbody class="tableBottom">
            <tr>
                <td style="width:6%">
                    <p><strong>序号</strong></p>
                </td>
                <td style="width:10%">
                    <p><strong>检验项</strong></p>
                </td>
                <td style="width:32%">
                    <p><strong>技术要�?/strong></p>
                </td>
                <td style="width:32%">
                    <p><strong>检验结�?/strong></p>
                </td>
                <td style="width:10%">
                    <p><strong>检验设�?/strong></p>
                </td>
                <td style="width:10%">
                    <p><strong>单项判定</strong></p>
                </td>
            </tr>
            <tr th:each="item ,t : ${checkItemsList}">
                <td style="width:6%">
                    <div class="content" th:text="${t.count}" style="font-weight: bold;"></div>
                </td>
                <td style="width:10%">
                    <div class="content" th:text="${item.name}" style="font-weight: bold;"></div>
                </td>
                <td style="width:32%">
                    <div class="content" th:text="${item.requirement}"
                         style="word-wrap:break-word;padding: 0 4px;font-weight: bold;text-align: left;">
                    </div>
                </td>
                <td style="width:32%;text-align: left;">
                    <div class="content" th:utext="${item.checkResult}"
                         style="word-wrap:break-word;padding: 0 4px;font-weight: bold;text-align: left;"></div>
                </td>
                <td style="width:10%">
                    <div class="content" style="font-weight: bold;"
                         th:text="${#lists.isEmpty(item.toolEquipTypes) ? '-' : #strings.arrayJoin(item.toolEquipTypes,',')}"></div>
                </td>
                <td style="width:10%">
                    <div class="content" th:text="${item.judge}" style="font-weight: bold;"></div>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="bottomCheck">
            <div class="left bold">
                <p th:text="'检验结�?'+${inspectResult}">检验结�?合格</p>
            </div>
            <br/>
            <br/>
            <div class="left bold" style="word-wrap:break-word;">
                <p style="word-wrap:break-word;" th:utext="${remark}"></p>
            </div>
            <br/>
            <br/>
            <br/>
            <br/>
            <br/>
            <div class="right"><p th:text="'检验员: ' + ${inspectUserName}">检验员: </p></div>
        </div>
        <div class="bottomCheck-none" style="page-break-inside: avoid;font-weight: bold;">
            <br/>
            <br/>
            <br/>
            <br/>
            <br/>
            <div class="right-part" style="margin-top: 50px;">
                <div style="z-index: 100">
                    <img th:src="${null == departmentSeal ? '' : departmentSeal.dataWithFormat}"
                         th:style="'width:' + ${null == departmentSeal ? 0 : departmentSeal.width * 37.8} + 'px;' +
                                                                                'height:' +  ${null == departmentSeal ? 0 : departmentSeal.height * 37.8} + 'px'"
                         alt="品质部门签章"/>
