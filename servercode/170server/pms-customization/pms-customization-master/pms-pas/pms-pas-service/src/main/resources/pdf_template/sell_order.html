<div>
    <table class="" style="width: 100%;">
        <tbody>
        <tr>
            <td colspan="2" style="width: 100%;vertical-align: middle;text-align: center;">
                <h1 style="text-align: center;">
            <span class="printTitle" contenteditable="false"
                  data-struct-type="text" style="border: 1px solid transparent; text-align: center; color:
                        rgb(189,189, 190); font-size: 28px;  word-wrap: break-word;" th:text="${printTitle}">
            </span>
                </h1>
                <div class="placeHolder"  th:style="${area1Style}">area</div>
            </td>
        </tr>

        </tbody>
    </table>

</div>

<div>
    <table class="" style="width: 100%;">
        <tbody>
        <tr>
            <td colspan="2" style="width: 50%;">
                <div>
                    <span class="productGradeInfo" contenteditable="false"
                          style="display: inline; border: 1px solid transparent; text-align: left; color: rgb(189, 189, 190); font-size: 15px; word-wrap: break-word;"
                          th:text="${productGradeInfo}">000</span>
                </div>
                <div class="placeHolder"  th:style="${area2Style}">area</div>
            </td>
        </tr>
        <tr>
            <td colspan="2" style="width: 33%;">
                <div>
                    <span class="batchNumberInfo" contenteditable="false"
                          style="display: inline; border: 1px solid transparent; text-align: left; color: rgb(189, 189, 190); font-size: 15px; word-wrap: break-word;"
                          th:text="${batchNumberInfo}">111</span>
                </div>
            </td>
            <td colspan="2" style="width: 33%;">
                <div>
                    <span class="customerInfo" contenteditable="false"
                          style="display: inline; border: 1px solid transparent; text-align: left; color: rgb(189, 189, 190); font-size: 15px; word-wrap: break-word;"
                          th:text="${customerInfo}">222</span>
                </div>
            </td>
            <td colspan="2" style="width: 33%;">
                <div>
                    <span class="deliveryDateInfo" contenteditable="false"
                          style="display: inline; border: 1px solid transparent; text-align: left; color: rgb(189, 189, 190); font-size: 15px; word-wrap: break-word;"
                          th:text="${deliveryDateInfo}">333</span>
                </div>
            </td>
        </tr>

        </tbody>
    </table>

</div>




<div class="placeHolder"  th:style="${area3Style}">area</div>


<div>
    <table cellspacing="0" style="width: 100%;border-collapse: collapse;font-size:14px;text-align: center; border-collapse: separate;
    border-top:1px solid black;
    border-left:1px solid black">
        <thead>
        <tr style="background-color: #fafafa">
            <th th:each="productColumnTitle : ${productColumnTitles}"
                th:style="${productColumnTitleStyleMapping.get(productColumnTitle)}"
                th:text="${productColumnTitle}">
            </th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="productElement : ${productElements}">
            <td class="sellOrderProductTableTd" style="text-align: center;border-right:1px solid black;border-bottom:1px solid black; " th:each="productColumnTitle : ${productColumnTitles}"
                th:text="${productElement.get(productColumnTitle)}">数据
            </td>
        </tr>
        </tbody>
    </table>
</div>


<div class="placeHolder"  th:style="${area4Style}">area</div>
<div style="width: 100%;text-align: right">
    <td colspan="2" style="width: 50%;text-align: right">
        <div>
                    <span class="downloadTime" contenteditable="false"
                          style="display: inline; border: 1px solid transparent; text-align: right; color: rgb(189, 189, 190); font-size: 14px; word-wrap: break-word;"
                          th:text="${downloadTime}">666</span>
        </div>
    </td>
</div>
