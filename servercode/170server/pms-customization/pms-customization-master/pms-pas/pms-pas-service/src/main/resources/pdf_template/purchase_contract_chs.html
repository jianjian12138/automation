<div>
    <table class="" style="width: 100%;">
        <tbody>
        <tr>
            <td colspan="2" style="width: 100%;vertical-align: middle;text-align: center;">
                <h2 style="text-align: center;">
            <span class="contractName" contenteditable="false"
                  data-struct-type="text" style="border: 1px solid transparent; text-align: center; color:
                        rgb(189,189, 190); font-size: 20px;  word-wrap: break-word;" th:text="${contractName}">
            </span>
                </h2>
            </td>
        </tr>

        </tbody>
    </table>

    <div style="display:inline-block;">
        <div style="display:inline-block; float: left; width: 100%;">
            <table class="" style="width: 100%; margin-top: 30px;">
                <tr>
                    <td contenteditable="false"
                        style="width: 50%; border: 1px solid transparent; text-align: left; color: rgb(189, 189, 190); font-size: 12px; word-wrap: break-word;">
                        <div style="text-align: left; font-size: 12px;">合同编号：
                            <span class="contractNumber" contenteditable="false"
                                  style="display: inline; border: 1px solid transparent; text-align: center; color: rgb(189, 189, 190); font-size: 12px; word-wrap: break-word;"
                                  th:text="${contractNumber}"></span>
                        </div>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</div>

<div style="display:inline-block">
    <div style="display:inline-block;float: left;width: 50%;">
        <table class="headPartyA" style="width: 100%;">
            <tr th:each="headParty : ${headPartyA}">
                <td contenteditable="false"
                    style="width: 50%;  border: 1px solid transparent; text-align: left; color: rgb(189, 189, 190); font-size: 12px; word-wrap: break-word;"
                    th:text="${headParty}">数据1
                </td>
            </tr>

        </table>
    </div>

    <div style="display:inline-block;float: left;width: 100%;">
        <table class="" style="width: 100%;">
            <tr>
                <td contenteditable="false"
                    style="width: 50%;  border: 1px solid transparent; text-align: left; color: rgb(189, 189, 190); font-size: 12px; word-wrap: break-word;">
                    <div style="text-align: left; font-size: 12px;">签订地址：
                        <span class="signAddr" contenteditable="false"
                              style="display: inline; border: 1px solid transparent; text-align: center; color: rgb(189, 189, 190); font-size: 12px; word-wrap: break-word;"
                              th:text="${signAddr}"></span>
                    </div>
                </td>
            </tr>
        </table>
    </div>
</div>

<div style="display:inline-block">
    <div style="display:inline-block;float: left;width: 50%;">
        <table class="headPartyB" style="width: 100%;">
            <tr th:each="headParty : ${headPartyB}">
                <td contenteditable="false"
                    style="width: 50%;  border: 1px solid transparent; text-align: left; color: rgb(189, 189, 190); font-size: 12px; word-wrap: break-word;"
                    th:text="${headParty}">数据2
                </td>
            </tr>

        </table>
    </div>

    <div style="display:inline-block;float: left;width: 100%;">
        <table class="" style="width: 100%;">
            <tr>
                <td contenteditable="false"
                    style="width: 50%;  border: 1px solid transparent; text-align: left; color: rgb(189, 189, 190); font-size: 12px; word-wrap: break-word;">
                    <div style="text-align: left; font-size: 12px;">签订时间：
                        <span class="createDate" contenteditable="false"
                              style="display: inline; border: 1px solid transparent; text-align: center; color: rgb(189, 189, 190); font-size: 12px; word-wrap: break-word;"
                              th:text="${createDate}"></span>
                    </div>
                </td>
            </tr>
        </table>
    </div>
</div>

<div class="placeHolder" th:style="${area3Style}">area</div>

<div>
    <table cellspacing="0" style="
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        text-align: center;
        border-top: 1px solid black;
        border-left: 1px solid black;
        ">
        <thead>
        <tr style="background-color: #fafafa; border-bottom: 1px solid black;">
            <th th:each="productColumnTitle : ${productColumnTitles}"
                th:style="${productColumnTitleStyleMapping.get(productColumnTitle)}"
                th:text="${productColumnTitle}"
                style="text-align: center; border-right: 1px solid black; border-bottom: 1px solid black;">
            </th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="productElement : ${productElements}">
            <td style="
                font-weight:normal;
                text-align: center;
                border-right: 1px solid black;
                border-bottom: 1px solid black;
                height: 30px;"
                th:each="productColumnTitle : ${productColumnTitles}"
                th:text="${productElement.get(productColumnTitle)}">数据
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div style="text-align: right;display: flex;align-items: center;flex-direction: row">
            <span contenteditable="false"
                  data-struct-type="text"
                  style="display:inline;border:1px solid transparent;text-align:center;color: #BDBDBE;font-size:10px;overflow:hidden;"
                  th:text="${amount}"></span>
</div>

<table class="clauses" th:if="${hasClauses}" th:style="${clauseStyle}">
    <tbody>
    <tr th:each="clause,iter:${clauses}">
        <td style="width: 100%;text-align: left;">
            <div class="clause" contenteditable="false" data-struct-type="text" th:utext="${clause}">
            </div>
        </td>
    </tr>
    </tbody>
</table>
