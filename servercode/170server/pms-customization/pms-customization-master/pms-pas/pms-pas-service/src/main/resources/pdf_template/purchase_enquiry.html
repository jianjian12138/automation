    <div>
        <table class="" style="width: 100%;">
            <tbody>
            <tr>
                <td colspan="2" style="width: 100%;vertical-align: middle;text-align: center;">
                    <h1 style="text-align: center;">
            <span class="enquiryName" contenteditable="false"
                  data-struct-type="text" style="border: 1px solid transparent; text-align: center; color:
                        rgb(189,189, 190); font-size: 28px;  word-wrap: break-word;" th:text="${enquiryName}">
            </span>
                    </h1>
                </td>
            </tr>
            <tr>
                <td colspan="2" style="width: 100%;">
                    <div style="text-align: left;">询价单号：
                        <span class="enquiryNumber" contenteditable="false"
                              style="display: inline; border: 1px solid transparent; text-align: center; color: rgb(189, 189, 190); font-size: 12px; word-wrap: break-word;"
                              th:text="${enquiryNumber}"></span>
                    </div>
                </td>
            </tr>

            </tbody>
        </table>

    </div>

<div style="height:12px;background-color: white"></div>

<div style="display:inline-block">
    <div style="display:inline-block;float: left;width: 50%;" >

        <table class="BuyerInfos" style="width: 100%;">
            <tr th:each="buyerInfo : ${buyerInfos}">
                <td contenteditable="false"
                    style="width: 50%;  border: 1px solid transparent; text-align: left; color: rgb(189, 189, 190); font-size: 14px; word-wrap: break-word;" th:text="${buyerInfo}">数据1
                </td>
            </tr>

        </table>
    </div>
    <div style="display:inline-block;float: left;width: 100%;">

        <table class="SellerInfos" style="width: 100%;">
            <tr th:each="sellerInfo : ${sellerInfos}">
                <td contenteditable="false"
                    style="width: 50%;  border: 1px solid transparent; text-align: left; color: rgb(189, 189, 190); font-size: 14px; word-wrap: break-word;" th:text="${sellerInfo}">数据2
                </td>
            </tr>
        </table>
    </div>
</div>

<div style="height:12px;background-color: white"></div>


<div>
    <table cellspacing="0" style="width: 100%;border-collapse: collapse;font-size:14px;text-align: center; border-collapse: separate;
    border-top:1px solid black;
    border-left:1px solid black">
        <thead>
        <tr style="background-color: #fafafa">
            <th th:each="productColumnTitle : ${productColumnTitles}"
                th:style="${productColumnTitleStyleMapping.get(productColumnTitle)}"
                th:text="${productColumnTitle}">
            </th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="productElement : ${productElements}">
            <td style="text-align: center;border-right:1px solid black;border-bottom:1px solid black; " th:each="productColumnTitle : ${productColumnTitles}"
                th:text="${productElement.get(productColumnTitle)}">数据
            </td>
        </tr>
        </tbody>
    </table>
</div>


<div style="height:12px;background-color: white"></div>

<div style="text-align: right;display: flex;align-items: center;flex-direction: row">
            <span contenteditable="false"
                  data-struct-type="text"
                  style="display:inline;border:1px solid transparent;text-align:center;color: #BDBDBE;font-size:14px;overflow:hidden;"
                  th:text="${amount}"></span>
</div>

<div style="height:12px;background-color: white;"></div>



<div style="text-align: left;width: 100%;display: flex;align-items: center;flex-direction: row">
            <div contenteditable="false"
                  data-struct-type="text"
                  style="display:inline;border:1px solid transparent;text-align:center;color: #BDBDBE;font-size:14px;overflow:hidden;"
                  th:text="${remark}"></div>
</div>
