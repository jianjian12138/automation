<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket客户端</title>
    <style>
        /* 现代化的WebSocket客户端样式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 100%;
            max-width: 800px;
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #2c3e50;
            font-size: 14px;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background-color: #fafafa;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
            background-color: white;
        }
        
        input[type="text"]:disabled {
            background-color: #f5f5f5;
            color: #9e9e9e;
            cursor: not-allowed;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 120px;
            position: relative;
            overflow: hidden;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        button:hover::before {
            left: 100%;
        }
        
        #connect-btn {
            background-color: #27ae60;
            color: white;
        }
        
        #connect-btn:hover:not(:disabled) {
            background-color: #229954;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
        }
        
        #disconnect-btn {
            background-color: #e74c3c;
            color: white;
        }
        
        #disconnect-btn:hover:not(:disabled) {
            background-color: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
        }
        
        #subscribe-btn {
            background-color: #3498db;
            color: white;
        }
        
        #subscribe-btn:hover:not(:disabled) {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }
        
        button:disabled {
            background-color: #95a5a6;
            color: #ecf0f1;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        #messages {
            height: 350px;
            overflow-y: auto;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            background-color: #fafafa;
            font-family: 'Courier New', Courier, monospace;
            position: relative;
            white-space: pre-wrap; /* 保留换行和空格 */
            word-break: break-all; /* 长单词换行 */
        }
        
        /* 滚动条样式 */
        #messages::-webkit-scrollbar {
            width: 8px;
        }
        
        #messages::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        
        #messages::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        
        #messages::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }
        
        .message {
            margin-bottom: 10px;
            padding: 10px 12px;
            border-radius: 6px;
            border-left: 4px solid transparent;
            transition: all 0.2s ease;
            word-wrap: break-word; /* 允许长单词换行 */
        }
        
        .message:hover {
            transform: translateX(2px);
        }
        
        .message.system {
            background-color: #f8f9fa;
            color: #6c757d;
            border-left-color: #6c757d;
        }
        
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border-left-color: #dc3545;
            font-weight: 500;
        }
        
        .message.received {
            background-color: #d1ecf1;
            color: #0c5460;
            border-left-color: #17a2b8;
        }
        
        /* 响应式设计 */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
                min-width: auto;
            }
            
            #messages {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebSocket客户端</h1>
        
        <div class="input-group">
            <label for="websocket-url">WebSocket端点地址:</label>
            <input type="text" id="websocket-url" placeholder="ws://192.168.2.34:8082/pms/endpoint" value="ws://192.168.2.34:8082/pms/endpoint">
        </div>
        
        <div class="input-group">
            <label for="user-code">User Code:</label>
            <input type="text" id="user-code" placeholder="190787210592256999" value="190787210592256999">
        </div>
        
        <div class="input-group">
            <label for="topic">订阅Topic:</label>
            <input type="text" id="topic" placeholder="/user/notice" value="/user/notice">
        </div>
        
        <div class="button-group">
            <button id="connect-btn">连接</button>
            <button id="disconnect-btn" disabled>断开连接</button>
            <button id="subscribe-btn" disabled>订阅Topic</button>
        </div>
        
        <div id="messages">
            <div class="message system">系统消息: 等待连接...</div>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const websocketUrlInput = document.getElementById('websocket-url');
        const userCodeInput = document.getElementById('user-code');
        const topicInput = document.getElementById('topic');
        const connectBtn = document.getElementById('connect-btn');
        const disconnectBtn = document.getElementById('disconnect-btn');
        const subscribeBtn = document.getElementById('subscribe-btn');
        const messagesDiv = document.getElementById('messages');
        
        // WebSocket实例
        let ws = null;
        
        // 添加消息到消息区域
        function addMessage(text, type = 'system') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            // 添加时间戳
            const timestamp = new Date().toLocaleTimeString();
            messageDiv.innerHTML = `<span style="color: #999; font-size: 12px; margin-right: 8px;">[${timestamp}]</span>${text}`;
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            // 限制消息数量，避免内存占用过大
            if (messagesDiv.children.length > 100) {
                messagesDiv.removeChild(messagesDiv.firstChild);
            }
        }
        
        // 更新按钮状态
        function updateButtonStates(isConnected) {
            connectBtn.disabled = isConnected;
            disconnectBtn.disabled = !isConnected;
            subscribeBtn.disabled = !isConnected;
            websocketUrlInput.disabled = isConnected;
            userCodeInput.disabled = isConnected;
        }
        
        // 连接WebSocket
        connectBtn.addEventListener('click', () => {
            const url = websocketUrlInput.value.trim();
            const userCode = userCodeInput.value.trim();
            
            if (!url) {
                addMessage('错误: 请输入WebSocket端点地址', 'error');
                return;
            }
            
            if (!userCode) {
                addMessage('错误: 请输入User Code', 'error');
                return;
            }
            
            try {
                ws = new WebSocket(url);
                
                // 连接打开时
                ws.onopen = () => {
                    addMessage(`已连接到 ${url}`);
                    
                    // 发送STOMP CONNECT帧
                    const connectFrame = `CONNECT\nuserCode:${userCode}\naccept-version:1.1,1.0\nheart-beat:10000,10000\n\n\0`;
                    ws.send(connectFrame);
                    addMessage(`已发送STOMP CONNECT帧`, 'system');
                    
                    updateButtonStates(true);
                };
                
                // 接收消息时
                ws.onmessage = (event) => {
                    try {
                        const data = event.data;
                        
                        // 处理STOMP协议消息
                        if (typeof data === 'string') {
                            // 检查是否为STOMP帧
                            if (data.includes('MESSAGE') || data.includes('RECEIPT')) {
                                // 解析STOMP帧
                                const lines = data.split('\n');
                                let messageBody = '';
                                let inBody = false;
                                
                                for (let i = 0; i < lines.length; i++) {
                                    const line = lines[i];
                                    // 空行标志着头部结束，消息体开始
                                    if (line === '') {
                                        inBody = true;
                                        continue;
                                    }
                                    // 跳过帧结束的null字符
                                    if (line === '\0') continue;
                                    
                                    // 收集消息体内容
                                    if (inBody) {
                                        messageBody += line;
                                    }
                                }
                                
                                // 如果有消息体内容，则显示它
                                if (messageBody.trim()) {
                                    // 尝试解析JSON格式的消息体
                                    try {
                                        const parsedMessage = JSON.parse(messageBody);
                                        // 格式化JSON以便更好地显示
                                        const formattedMessage = JSON.stringify(parsedMessage, null, 2);
                                        addMessage(`接收到消息:\n${formattedMessage}`, 'received');
                                    } catch (e) {
                                        // 如果不是JSON，直接显示文本
                                        addMessage(`接收到消息:\n${messageBody}`, 'received');
                                    }
                                } else {
                                    // 如果没有可识别的消息体，显示原始帧
                                    addMessage(`收到STOMP帧:\n${data.replace('\0', '')}`, 'received');
                                }
                            } else if (data.includes('CONNECTED')) {
                                // 显示连接确认
                                addMessage('已成功连接到STOMP服务器', 'system');
                            } else {
                                // 其他类型的消息
                                addMessage(`收到消息: ${data.replace('\0', '')}`, 'received');
                            }
                        } else {
                            // 非字符串消息
                            addMessage(`收到非文本消息: ${data}`, 'received');
                        }
                    } catch (error) {
                        addMessage(`处理消息时出错: ${error}`, 'error');
                    }
                };
                
                // 连接关闭时
                ws.onclose = (event) => {
                    addMessage(`连接已关闭 (代码: ${event.code})`);
                    updateButtonStates(false);
                    ws = null;
                };
                
                // 连接出错时
                ws.onerror = (error) => {
                    addMessage(`连接错误: ${error}`, 'error');
                    updateButtonStates(false);
                    ws = null;
                };
                
            } catch (error) {
                addMessage(`连接失败: ${error}`, 'error');
            }
        });
        
        // 断开WebSocket连接
        disconnectBtn.addEventListener('click', () => {
            if (ws) {
                addMessage('正在断开连接...');
                ws.close();
            }
        });
        
        // 订阅Topic
        subscribeBtn.addEventListener('click', () => {
            if (!ws) {
                addMessage('错误: 未连接到WebSocket服务器', 'error');
                return;
            }
            
            const topic = topicInput.value.trim();
            if (!topic) {
                addMessage('错误: 请输入要订阅的Topic', 'error');
                return;
            }
            
            try {
                // 生成一个唯一的订阅ID
                const subscriptionId = 'sub-' + Date.now();
                
                // 发送STOMP SUBSCRIBE帧
                const subscribeFrame = `SUBSCRIBE\nid:${subscriptionId}\ndestination:${topic}\n\n\0`;
                ws.send(subscribeFrame);
                addMessage(`已发送STOMP SUBSCRIBE帧到 ${topic}`, 'system');
            } catch (error) {
                addMessage(`订阅失败: ${error}`, 'error');
            }
        });
    </script>
</body>
</html>
